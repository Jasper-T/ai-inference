[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inference"
version = "0.2.1"
description = "Pipeline-based model inference SDK with a transport-independent engine boundary"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<5",
    "PyYAML>=6,<7",
    "pydantic>=2.6,<3",
    "Pillow>=9.5,<13",
    "loguru>=0.7,<1",
]

[project.urls]
Homepage = "https://github.com/Jasper-T/ai-inference"
Documentation = "https://github.com/Jasper-T/ai-inference#readme"
Repository = "https://github.com/Jasper-T/ai-inference"
Issues = "https://github.com/Jasper-T/ai-inference/issues"

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
]
onnx-cpu = [
    "onnxruntime>=1.18,<2",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.18,<2; platform_system == 'Linux' or platform_system == 'Windows'",
]

# Compatibility extra; install vendor wheels separately from requirements/ascend.txt.
ascend = []

[dependency-groups]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
]
dev = [
    {include-group = "test"},
    "ruff==0.16.10",
    "twine>=6.1,<8",
]

[tool.uv]
conflicts = [
    [{extra = "onnx-cpu"}, {extra = "onnx-gpu"}, {extra = "ascend"}],
    [{group = "test"}, {extra = "onnx-gpu"}, {extra = "ascend"}],
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_inference*"]
namespaces = false

[tool.setuptools.package-data]
ai_inference = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ai_inference"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
