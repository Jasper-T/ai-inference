[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inference"
version = "0.2.0"
description = "Pipeline-based model inference SDK with a transport-independent engine boundary"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<5",
    "PyYAML>=6,<7",
    "pydantic>=2.6,<3",
    "Pillow>=9.5,<13",
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
]
onnx-cpu = [
    "onnxruntime>=1.18,<2",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.18,<2; platform_system == 'Linux' or platform_system == 'Windows'",
]

# Vendor wheels are selected by CPython version and Linux architecture.
ascend = [
    "aclruntime @ https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp310-cp310-linux_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10' and implementation_name == 'cpython'",
    "aclruntime @ https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10' and implementation_name == 'cpython'",
    "aclruntime @ https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp311-cp311-linux_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.11' and implementation_name == 'cpython'",
    "aclruntime @ https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp311-cp311-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11' and implementation_name == 'cpython'",
    "aclruntime @ https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp312-cp312-linux_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12' and implementation_name == 'cpython'",
    "aclruntime @ https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12' and implementation_name == 'cpython'",
    "ais-bench @ https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/ais_bench-0.0.2-py3-none-any.whl ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64') and python_version >= '3.10' and python_version < '3.13' and implementation_name == 'cpython'",
]

[dependency-groups]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
]
dev = [
    {include-group = "test"},
    "ruff==0.16.10",
]

[tool.uv]
conflicts = [
    [{extra = "onnx-cpu"}, {extra = "onnx-gpu"}, {extra = "ascend"}],
    [{group = "test"}, {extra = "onnx-gpu"}, {extra = "ascend"}],
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_inference*"]
namespaces = false

[tool.setuptools.package-data]
ai_inference = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ai_inference"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
