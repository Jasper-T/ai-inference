[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inference"
version = "0.2.4"
description = "Pipeline-based model inference SDK with a transport-independent engine boundary"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Shared lower bounds cover the minimum ORT + HTTP service combination.
    "numpy>=1.21.6,<2; python_version < '3.11'",
    "numpy>=1.24.2,<2; python_version >= '3.11' and python_version < '3.12'",
    "numpy>=1.26.0,<2; python_version >= '3.12'",
    "opencv-python-headless>=3.4.16.59,<4.12; python_version < '3.11'",
    "opencv-python-headless>=3.4.17.61,<4.12; python_version >= '3.11'",
    "PyYAML>=6,<7; python_version < '3.12'",
    "PyYAML>=6.0.1,<7; python_version >= '3.12'",
    "pydantic>=2.0.2,<3",
    "Pillow>=9.1,<13; python_version < '3.11'",
    "Pillow>=9.2,<13; python_version >= '3.11' and python_version < '3.12'",
    "Pillow>=10.0,<13; python_version >= '3.12'",
    "loguru>=0.2.2,<1; python_version < '3.12'",
    "loguru>=0.4,<1; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/Jasper-T/ai-inference"
Documentation = "https://github.com/Jasper-T/ai-inference#readme"
Repository = "https://github.com/Jasper-T/ai-inference"
Issues = "https://github.com/Jasper-T/ai-inference/issues"

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "httpx>=0.27,<1",
]
onnx-cpu = [
    "onnxruntime>=1.18,<2",
]
# Explicit CUDA families. Unsupported platform/Python combinations skip these requirements.
onnx-gpu-cu11 = [
    "onnxruntime-gpu==1.18.1; python_version < '3.13' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
    "numpy<2; python_version < '3.13' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
    "opencv-python-headless<4.12; python_version < '3.13' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
]
onnx-gpu-cu12 = [
    "onnxruntime-gpu>=1.21,<1.27; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
onnx-gpu-cu13 = [
    "onnxruntime-gpu>=1.29,<1.32; python_version >= '3.11' and ((sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
]

# uv selects pinned wheel sources below; pip also uses requirements/ascend.txt.
ascend = [
    "aclruntime==0.0.2; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64') and python_version >= '3.10' and python_version < '3.13' and implementation_name == 'cpython'",
    "ais-bench==0.0.2; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64') and python_version >= '3.10' and python_version < '3.13' and implementation_name == 'cpython'",
]

[dependency-groups]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "onnx>=1.16,<2",
]
dev = [
    {include-group = "test"},
    "ruff==0.16.10",
    "twine>=6.1,<8",
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.11'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.10'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.11'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.12'",
]
conflicts = [
    [{extra = "onnx-cpu"}, {extra = "onnx-gpu-cu11"}, {extra = "onnx-gpu-cu12"}, {extra = "onnx-gpu-cu13"}, {extra = "ascend"}],
]

[tool.uv.sources]
aclruntime = [
    { url = "https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp310-cp310-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10' and implementation_name == 'cpython'", extra = "ascend" },
    { url = "https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10' and implementation_name == 'cpython'", extra = "ascend" },
    { url = "https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp311-cp311-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.11' and implementation_name == 'cpython'", extra = "ascend" },
    { url = "https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11' and implementation_name == 'cpython'", extra = "ascend" },
    { url = "https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12' and implementation_name == 'cpython'", extra = "ascend" },
    { url = "https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12' and implementation_name == 'cpython'", extra = "ascend" },
]
ais-bench = [
    { url = "https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/ais_bench-0.0.2-py3-none-any.whl", marker = "sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64') and python_version >= '3.10' and python_version < '3.13' and implementation_name == 'cpython'", extra = "ascend" },
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_inference*"]
namespaces = false

[tool.setuptools.package-data]
ai_inference = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ai_inference"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
