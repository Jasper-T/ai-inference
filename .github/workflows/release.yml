name: GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tools_sha: ${{ steps.tools.outputs.sha }}
    steps:
      - name: Checkout release tooling from default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - name: Validate tag input and record tooling revision
        id: tools
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 tooling/scripts/release.py tag --tag "$RELEASE_TAG"
          printf 'sha=%s\n' "$(git -C tooling rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout selected tag source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: source
          persist-credentials: false
      - name: Validate all versions and CHANGELOG section
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python3 tooling/scripts/release.py validate --tag "$RELEASE_TAG" --source source
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: false
      - name: SDK checks and clean build
        working-directory: source
        run: |
          if python3 -c 'import tomllib; import sys; sys.exit(0 if "service" in tomllib.load(open("pyproject.toml", "rb"))["project"].get("optional-dependencies", {}) else 1)'; then
            uv sync --locked --extra service
            uv run --locked --no-sync python -c 'import ai_inference.service.app; import httpx'
          else
            uv sync --locked
          fi
          uv lock --check
          uv run --locked --no-sync ruff check src tests scripts examples
          uv run --locked --no-sync ruff format --check src tests scripts examples
          uv run --locked --no-sync python scripts/test.py all -- -rs
          uv run --locked --no-sync ruff check ../tooling/scripts/release.py ../tooling/tests/test_release.py
          uv run --locked --no-sync ruff format --check ../tooling/scripts/release.py ../tooling/tests/test_release.py
          uv run --locked --no-sync python -m pytest -q ../tooling/tests/test_release.py
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --build-constraint ../tooling/.github/build-constraints.txt
      - name: Prepare checked assets and release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python3 tooling/scripts/release.py prepare --tag "$RELEASE_TAG" --source source --output bundle
      - name: Transfer validated bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the same tooling revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tools_sha }}
          path: tooling
          persist-credentials: false
      - name: Download validated bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: bundle
      - name: Publish or verify identical existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tooling/scripts/release.py publish --output bundle --repo "$GH_REPO"
